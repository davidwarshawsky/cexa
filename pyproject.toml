[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cexa"
version = "0.1.0"
description = "Lightweight CLI client for the Exa Remote MCP Server with token-efficient inspection, dynamic tool calling, and zero third-party dependencies"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "David Philips" }
]
keywords = [
    "exa",
    "mcp",
    "model-context-protocol",
    "ai-agent",
    "cli",
    "search",
    "agent-skill"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities"
]

[project.urls]
Homepage = "https://github.com/davidwarshawsky/cexa"
Repository = "https://github.com/davidwarshawsky/cexa.git"
Issues = "https://github.com/davidwarshawsky/cexa/issues"

[project.scripts]
cexa = "cexa.cli:main"
